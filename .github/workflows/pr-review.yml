name: Automated PR review
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing PR number to review
        required: true
        type: number
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  checks: write
concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false
jobs:
  review:
    name: Review metadata
    if: github.event_name == 'pull_request_target' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Privileged workflow: checkout ONLY the trusted base, never PR head/merge.
      # Never install PR dependencies, execute PR code, or download PR artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const { reviewPullRequest } = require('./.github/scripts/pr-policy.cjs');
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid PR number');
            context.payload.pull_request = { number };
            await reviewPullRequest({ github, context, core });
