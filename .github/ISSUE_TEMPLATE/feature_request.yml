name: 功能建议
description: 描述要解决的问题、建议方案与兼容性影响。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有建议，并阅读 [兼容边界](https://github.com/ZhaoJun233/agentrouter-magpie-plugin/blob/master/docs/OPTIMIZATION.md)。
        不接受以删除不透明 reasoning、工具或引用历史制造成功，或自动重试失败请求的方案；安全漏洞请走 [私密报告渠道](https://github.com/ZhaoJun233/agentrouter-magpie-plugin/security/advisories/new)。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明使用场景、当前限制及影响；不要包含用户对话或敏感数据。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述期望行为、范围和可验证的完成条件，而不只是实现名称。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 说明现有能力或其他方案为何不足；没有则写明。
    validations:
      required: false
  - type: textarea
    id: compatibility
    attributes:
      label: 风险与兼容性
      description: 说明对历史状态、工具与引用、认证边界、日志保密及升级回滚的影响；不影响也请解释原因。
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issue，并阅读相关兼容边界。
          required: true
        - label: 我确认未提交真实凭据、Cookie、Token 或用户对话。
          required: true
